// Minimal NeoForge workspace: build metadata, development runs and Java 21 compilation.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Minecraft already supplies Gson; standalone parser regression tests need it on their own runtime classpath.
dependencies { testRuntimeOnly 'com.google.code.gson:gson:2.10.1' }

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/.cache/**', '**/*.bbmodel'
}

neoForge {
    version = project.neo_version
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            // Automated fixtures keep the desktop cursor free and audio muted without altering saved options.
            if (['verifyClient', 'verifyPreview', 'verifyPortals', 'verifyTemplates'].any { project.hasProperty(it) }) {
                programArguments.addAll '--mixin', 'elsebase-client-checks.mixins.json'
            }
            if (project.hasProperty('verifyClient')) systemProperty 'elsebase.verifyClient', 'true'
            if (project.hasProperty('verifyPreview')) systemProperty 'elsebase.verifyPreview', 'true'
            if (project.hasProperty('verifyTemplates')) {
                def profile = project.findProperty('templateProfile') ?: 'vanilla'
                if (!(profile in ['vanilla', 'iris', 'iris-active'])) throw new GradleException('Unknown templateProfile')
                gameDirectory = file(profile == 'vanilla' ? 'build/template-client' : "build/template-client-${profile}")
                systemProperty 'elsebase.verifyTemplates', 'true'
                systemProperty 'elsebase.templateShaderExpected', profile == 'iris-active' ? 'true' : 'false'
            }
            if (project.hasProperty('verifyPortals')) {
                def profile = project.findProperty('portalProfile') ?: 'vanilla'
                if (!(profile in ['vanilla', 'iris', 'iris-active'])) throw new GradleException('Unknown portalProfile')
                gameDirectory = file("build/portal-client-${profile}")
                systemProperty 'elsebase.verifyPortals', 'true'
                systemProperty 'elsebase.portalGraphics', project.findProperty('portalGraphics') ?: 'fancy'
                systemProperty 'elsebase.expectShaderFallback', profile == 'iris-active' ? 'true' : 'false'
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('build/gametest-themes-v2')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Exercise production domain code without requiring a Minecraft process or extra test framework.
tasks.register('domainTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.elsebase.world.DomainTests'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn 'domainTest' }
// DomainTests has its own executable runner; Minecraft integration tests use runGameTestServer.
tasks.named('test') { enabled = false }

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Development fixtures stay available to local runs, but must never enter the distributed mod.
def developmentAssets = [
    'dev/elsebase/IntegrationTests*', 'dev/elsebase/template/TemplateIntegrationTests*',
    'dev/elsebase/preview/PreviewIntegrationTests*', 'dev/elsebase/client/ClientChecks*',
    'dev/elsebase/client/PreviewChecks*', 'dev/elsebase/client/TemplateChecks*',
    'dev/elsebase/client/preview/PortalRenderChecks*', 'dev/elsebase/client/checks/**',
    'elsebase-client-checks.mixins.json', 'gametest_pack/**', 'data/elsebase/structure/empty.nbt'
]
tasks.named('jar', Jar) {
    exclude developmentAssets
    from('TEMPLATE_LICENSE.txt') {
        into 'META-INF'
    }
}

tasks.named('wrapper', Wrapper) {
    distributionType = Wrapper.DistributionType.BIN
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Check the deliverable itself, including generated text; development launches use exploded classes/resources.
def releaseArchive = tasks.named('jar', Jar).flatMap { it.archiveFile }
tasks.register('verifyReleaseJar') {
    dependsOn 'jar'
    inputs.file releaseArchive
    doLast {
        new java.util.zip.ZipFile(releaseArchive.get().asFile).withCloseable { archive ->
            def names = archive.entries().collect { it.name }
            if (names.any { it.contains('IntegrationTests') || it.contains('Checks.class') || it.contains('client/checks/') || it.startsWith('gametest_pack/') }) {
                throw new GradleException('Development fixtures leaked into the release JAR')
            }
            ['META-INF/neoforge.mods.toml', 'dev/elsebase/Elsebase.class', 'assets/elsebase/textures/item/paint_tool.png', 'assets/elsebase/textures/item/scanner.png'].each {
                if (!names.contains(it)) throw new GradleException("Missing release asset: ${it}")
            }
            def language = archive.getInputStream(archive.getEntry('assets/elsebase/lang/de_de.json')).withCloseable { new groovy.json.JsonSlurper().parse(it, 'UTF-8') }
            if (language['tooltip.elsebase.aim'] != 'Wand, Boden oder Decke ansehen. Kein Moduswechsel n\u00f6tig.') {
                throw new GradleException('Generated German text has an encoding regression')
            }
        }
    }
}
tasks.named('check') { dependsOn 'verifyReleaseJar' }
