# Mod metadata expanded by Gradle; only Minecraft 1.21.1 is supported.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
A permanent workspace beyond the world. Summon a doorway, build your base,
and return through persistent cross-dimensional thresholds. Includes modular
rooms, structural tools, seven built-in themes and shared custom room designs.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},21.2)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
